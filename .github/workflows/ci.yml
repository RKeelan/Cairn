name: CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - .github/dependabot.yml
  workflow_dispatch:

# A newer push to a pull request cancels the run still going for the one before.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 21

    # The runner's Android SDK has its licences accepted but lacks the platform compileSdk names (37 minor 2). AGP installs the
    # build tools it needs.
    - name: Install the Android platform
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        validate-wrappers: true

    # ktlint, the unit tests and their coverage check, and Lint.
    - name: Check
      run: ./gradlew check --no-daemon
